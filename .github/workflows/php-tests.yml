name: PHP tests

on:
  push:
    branches:
      - trunk
    paths:
      - '**.php'
      - '.github/workflows/php-tests.yml'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/php-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Run every *-tests.php
        run: |
          set -e
          find tools -name '*-tests.php' -print0 | sort -z | while IFS= read -r -d '' test; do
            echo "== $test"
            php "$test"
          done
