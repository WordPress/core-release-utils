# Waits until the release tags on core.svn reach the WordPress/WordPress Git mirror. Start it after the SVN tags are created.
name: Tags reached mirror

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Comma-separated release tags, for example 7.1.5,7.0.6'
        required: true
        type: string
      timeout:
        description: 'How long to wait for the tags, at most 50m'
        required: false
        type: string
        default: '45m'
      interval:
        description: 'Time between checks (the tool default is 60s)'
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify-tags-reached-mirror:
    name: Verify tags reached the mirror
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSIONS: ${{ inputs.versions }}
      TIMEOUT: ${{ inputs.timeout }}
      INTERVAL: ${{ inputs.interval }}
    steps:
      - name: Check the inputs
        run: |
          refuse() {
            echo "::error::$1"
            echo "Refused: $1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          IFS=',' read -ra items <<< "$VERSIONS"
          [ "${#items[@]}" -gt 0 ] || refuse 'No versions given.'
          list=()
          for item in "${items[@]}"; do
            version="${item//[[:space:]]/}"
            [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$ ]] || refuse "Not an X.Y.Z or X.Y version: '$item'."
            list+=("$version")
          done
          [[ $TIMEOUT =~ ^([0-9]+)([smh]?)$ ]] || refuse "Bad timeout: '$TIMEOUT'. Use a whole number with s, m or h."
          case "${BASH_REMATCH[2]}" in h) seconds=$((10#${BASH_REMATCH[1]} * 3600)) ;; m) seconds=$((10#${BASH_REMATCH[1]} * 60)) ;; *) seconds=$((10#${BASH_REMATCH[1]})) ;; esac
          [ "$seconds" -le 3000 ] || refuse "The timeout $TIMEOUT is longer than 50m, so the job would stop first."
          echo "VERSIONS=$(IFS=,; echo "${list[*]}")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none
      - name: verify-tags-reached-mirror
        run: |
          args=(--tags="$VERSIONS" --timeout="$TIMEOUT")
          [ -z "$INTERVAL" ] || args+=(--interval="$INTERVAL")
          code=0
          php verify-tags-reached-mirror/verify-tags-reached-mirror.php "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/output.log" || code=$?
          {
            echo '```'
            sed -n '/^Summary$/,$p' "$RUNNER_TEMP/output.log" | grep . || tail -n 20 "$RUNNER_TEMP/output.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
