# Checks that the language packs and localized zips exist for each locale. Start it after auto-updates are on.
name: Localized packages

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Comma-separated versions, the newest on each branch, for example 7.1.5,7.0.6'
        required: true
        type: string
      locales:
        description: 'Comma-separated locales to check instead of the expected list, for example it_IT,fr_FR'
        required: false
        type: string
      timeout:
        description: 'How long to wait for the packages, at most 3h. 0 checks once.'
        required: false
        type: string
        default: '3h'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify-localized-packages:
    name: Verify localized packages
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      VERSIONS: ${{ inputs.versions }}
      LOCALES: ${{ inputs.locales }}
      TIMEOUT: ${{ inputs.timeout }}
    steps:
      - name: Check the inputs
        run: |
          refuse() {
            echo "::error::$1"
            echo "Refused: $1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          IFS=',' read -ra items <<< "$VERSIONS"
          [ "${#items[@]}" -gt 0 ] || refuse 'No versions given.'
          list=()
          for item in "${items[@]}"; do
            version="${item//[[:space:]]/}"
            [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$ ]] || refuse "Not an X.Y.Z or X.Y version: '$item'."
            list+=("$version")
          done
          [[ $TIMEOUT =~ ^([0-9]+)([smh]?)$ ]] || refuse "Bad timeout: '$TIMEOUT'. Use a whole number with s, m or h."
          case "${BASH_REMATCH[2]}" in h) seconds=$((10#${BASH_REMATCH[1]} * 3600)) ;; m) seconds=$((10#${BASH_REMATCH[1]} * 60)) ;; *) seconds=$((10#${BASH_REMATCH[1]})) ;; esac
          [ "$seconds" -le 10800 ] || refuse "The timeout $TIMEOUT is longer than 3h, so the job would stop first."
          echo "VERSIONS=$(IFS=,; echo "${list[*]}")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none
      - name: verify-localized-packages
        run: |
          args=(--versions="$VERSIONS" --timeout="$TIMEOUT")
          [ -z "$LOCALES" ] || args+=(--locales="$LOCALES")
          code=0
          php verify-localized-packages/verify-localized-packages.php "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/output.log" || code=$?
          {
            echo '```'
            awk '/^-+$/ { tail = ""; next } { tail = tail $0 "\n" } END { printf "%s", tail }' "$RUNNER_TEMP/output.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
