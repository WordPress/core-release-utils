# Checks that the language packs and localized zips exist for each locale. Start it after auto-updates are on.
name: "Release checks: Localized packages"

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Comma-separated versions, the newest on each branch, for example 7.1.5,7.0.6'
        required: true
        type: string
      locales:
        description: 'Comma-separated locales to check instead of the expected list, for example it_IT,fr_FR'
        required: false
        type: string
      timeout:
        description: 'How long to wait for the packages, at most 3h. 0 checks once.'
        required: false
        type: string
        default: '3h'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify-localized-packages:
    name: Verify localized packages
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      VERSIONS: ${{ inputs.versions }}
      LOCALES: ${{ inputs.locales }}
      TIMEOUT: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none
      - name: Check the inputs
        run: php .github/scripts/check-inputs.php --max-timeout=3h
      - name: Run verify-localized-packages
        id: run
        run: |
          args=(--versions="$VERSIONS" --timeout="$TIMEOUT")
          [ -z "$LOCALES" ] || args+=(--locales="$LOCALES")
          php verify-localized-packages/verify-localized-packages.php "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/output.log"
      - name: Write the summary
        if: ${{ always() && steps.run.outcome != 'skipped' }}
        run: |
          {
            echo '```'
            awk '/^-+$/ { tail = ""; next } { tail = tail $0 "\n" } END { printf "%s", tail }' "$RUNNER_TEMP/output.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
